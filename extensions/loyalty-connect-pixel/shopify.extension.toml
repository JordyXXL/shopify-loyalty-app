# Loyalty Connect's web pixel: the shop's storefront and checkout events to Loyalty Connect's collector (/collect?k=<public key>).
# The same pixel as the one of Loyalty Connect's own Shopify app (same events, ids, consent and settings), so the data is the same.
#
# Not installed by deploying alone: the app creates it per shop with webPixelCreate (app/loyalty-connect/pixel.server.js) when a
# tenant switches Loyalty Connect on, and deletes it when it is switched off. Needs the optional scopes write_pixels and
# read_customer_events. The CLI adds a `uid` here on the first deploy: commit it and never change it afterwards.
type = "web_pixel_extension"
name = "loyalty-connect-pixel"
runtime_context = "strict"

# Shopify loads this pixel only for visitors who granted analytics AND marketing (Customer Privacy API). That is why the pixel
# reports both Consent Mode types as granted: it never runs without them.
[customer_privacy]
analytics = true
marketing = true
preferences = false
sale_of_data = "disabled"

# Written by the app with webPixelCreate / webPixelUpdate.
[settings]
type = "object"

[settings.fields.collectorUrl]
name = "Collector URL"
description = "Loyalty Connect's origin, as set in the app's LOYALTY_CONNECT_URL"
type = "single_line_text_field"
validations = [{ name = "min", value = "1" }]

[settings.fields.siteKey]
name = "Site key"
description = "The public key of the shop's source in Loyalty Connect (cs_pub_...)"
type = "single_line_text_field"
validations = [{ name = "min", value = "1" }]
